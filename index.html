<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Territory Pro - Alta Visibilidad</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');

        :root {
            --bg-main: #f0f2f5;
            --accent: #007aff;
            --glass: rgba(255, 255, 255, 0.8);
            --card-shadow: 0 10px 30px rgba(0,0,0,0.05);
            /* Nuevo Azul de alto contraste */
            --t-bg: #0056b3; 
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-main);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #1d1d1f;
        }

        #capture-area { padding: 50px; background: var(--bg-main); }

        .container {
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 40px;
            padding: 40px;
            width: 1000px;
            box-shadow: var(--card-shadow);
            border: 1px solid rgba(255,255,255,0.4);
        }

        header { 
            display: flex; 
            justify-content: space-between; 
            align-items: flex-start; 
            margin-bottom: 30px;
        }

        /* Eliminado "Hola Germán", actualizado título */
        h1 { font-size: 2.2rem; font-weight: 800; margin: 0; letter-spacing: -1px; }
        .subtitle { color: #86868b; font-weight: 600; margin-top: 5px; font-size: 1rem; }

        .date-picker-container {
            background: white;
            padding: 10px 15px;
            border-radius: 12px;
            border: 1px solid #e5e5ea;
        }
        .date-picker-container label { display: block; font-size: 0.65rem; font-weight: 800; color: var(--accent); text-transform: uppercase; margin-bottom: 4px; }
        input[type="date"] { border: none; font-family: inherit; font-weight: 600; outline: none; cursor: pointer; color: #1d1d1f; }

        .week-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 15px; }
        .day-column { display: flex; flex-direction: column; gap: 15px; }

        .card {
            background: white;
            aspect-ratio: 1 / 1;
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            padding: 15px;
            position: relative;
            border: 1px solid #f2f2f7;
        }

        .day-info { margin-bottom: 8px; }
        .day-name { font-weight: 800; font-size: 0.75rem; text-transform: uppercase; color: #1d1d1f; }
        .day-date { font-size: 0.7rem; color: #86868b; font-weight: 600; }

        .territory-list { flex-grow: 1; display: flex; flex-wrap: wrap; gap: 5px; align-content: center; justify-content: center; }

        /* REDISEÑO DE NÚMEROS: ALTO CONTRASTE */
        .t-badge {
            background-color: var(--t-bg); /* Azul oscuro plano */
            color: white; /* Blanco puro */
            width: 40px; height: 40px;
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-weight: 800; /* Negrita extra */
            font-size: 1.3rem; /* Ligeramente más grande */
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15); /* Sombra más definida */
        }

        .btn-add {
            position: absolute; bottom: 12px; right: 12px;
            width: 30px; height: 30px;
            background: #f2f2f7; border: none; border-radius: 8px;
            color: var(--accent); font-size: 18px; font-weight: 600; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }

        .actions { margin-top: 30px; display: flex; justify-content: space-between; align-items: center; }
        
        #btn-export {
            background: #1d1d1f; color: white; border: none;
            padding: 12px 24px; border-radius: 14px;
            font-weight: 600; cursor: pointer; transition: all 0.2s;
        }
        #btn-export:hover { background: #000; transform: translateY(-1px); }

        /* Modal */
        .modal {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.3); backdrop-filter: blur(8px);
            align-items: center; justify-content: center; z-index: 1000;
        }
        .modal-content { background: white; padding: 25px; border-radius: 25px; width: 320px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); text-align: center;}
        .num-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 15px 0; max-height: 220px; overflow-y: auto; padding: 5px;}
        .num-btn { padding: 10px; border: 1px solid #e5e5ea; border-radius: 10px; background: #f9f9fb; cursor: pointer; font-weight: 600; font-size: 1rem; }
        .num-btn:hover { background: var(--accent); color: white; border-color: var(--accent); }
    </style>
</head>
<body>

<div id="capture-area">
    <div class="container">
        <header>
            <div>
                <h1>Programación de Territorios</h1>
                <div class="subtitle" id="week-range-text">Cargando semana...</div>
            </div>
            <div class="date-picker-container" id="picker-ui">
                <label>Lunes de la semana</label>
                <input type="date" id="monday-picker" onchange="updateWeek()">
            </div>
        </header>

        <div class="week-grid" id="main-grid"></div>

        <div class="actions">
            <button onclick="clearData()" style="background:none; border:none; color:#ff3b30; cursor:pointer; font-weight:600; font-size:0.9rem;">Reiniciar territorios</button>
            <button id="btn-export">📤 Compartir imagen</button>
        </div>
    </div>
</div>

<div id="modal" class="modal">
    <div class="modal-content">
        <h3 style="margin-top:0; font-size:1.2rem;">Asignar Territorio</h3>
        <div class="num-grid" id="num-grid"></div>
        <button onclick="closeModal()" style="width:100%; padding:10px; border:none; border-radius:12px; background:#f2f2f7; cursor:pointer; font-weight:600;">Cancelar</button>
    </div>
</div>

<script>
    const weekStructure = [
        { name: 'Lunes', offset: 0, shifts: 1 },
        { name: 'Martes', offset: 1, shifts: 1 },
        { name: 'Miércoles', offset: 2, shifts: 2 },
        { name: 'Jueves', offset: 3, shifts: 1 },
        { name: 'Viernes', offset: 4, shifts: 2 },
        { name: 'Domingo', offset: 6, shifts: 1 }
    ];

    let activeSlotId = null;
    let territoryData = JSON.parse(localStorage.getItem('territoryData')) || {};
    let selectedMonday = localStorage.getItem('selectedMonday') || "";

    function init() {
        if (selectedMonday) {
            document.getElementById('monday-picker').value = selectedMonday;
        } else {
            // Cargar semana actual por defecto si no hay guardada
            const today = new Date();
            const day = today.getDay(); // 0 (Dom) - 6 (Sab)
            const diff = today.getDate() - day + (day === 0 ? -6 : 1); // Ajuste para Lunes
            const monday = new Date(today.setDate(diff));
            selectedMonday = monday.toISOString().split('T')[0];
            document.getElementById('monday-picker').value = selectedMonday;
            localStorage.setItem('selectedMonday', selectedMonday);
        }
        render();
    }

    function updateWeek() {
        selectedMonday = document.getElementById('monday-picker').value;
        localStorage.setItem('selectedMonday', selectedMonday);
        render();
    }

    function getFormattedDate(baseDate, offsetDays) {
        const d = new Date(baseDate + 'T00:00:00');
        d.setDate(d.getDate() + offsetDays);
        const day = d.getDate();
        const month = d.toLocaleString('es-ES', { month: 'short' }).replace('.', '');
        return `${day} ${month}`;
    }

    function render() {
        const grid = document.getElementById('main-grid');
        const rangeText = document.getElementById('week-range-text');
        grid.innerHTML = '';

        if (!selectedMonday) {
            rangeText.innerText = "Por favor selecciona el lunes para comenzar";
            return;
        }

        const start = getFormattedDate(selectedMonday, 0);
        const end = getFormattedDate(selectedMonday, 6);
        const year = new Date(selectedMonday + 'T00:00:00').getFullYear();
        rangeText.innerText = `Semana del ${start} al ${end} de ${year}`;

        weekStructure.forEach((day, dIdx) => {
            const col = document.createElement('div');
            col.className = 'day-column';
            const dayDateString = getFormattedDate(selectedMonday, day.offset);

            for(let s = 0; s < day.shifts; s++) {
                const id = `slot-${dIdx}-${s}`;
                const territories = territoryData[id] || [];
                const card = document.createElement('div');
                card.className = 'card';
                
                let tHtml = territories.map((num, i) => 
                    `<div class="t-badge" onclick="removeT('${id}', ${i}, event)">${num}</div>`
                ).join('');

                card.innerHTML = `
                    <div class="day-info">
                        <div class="day-name">${day.name}</div>
                        <div class="day-date">${dayDateString}</div>
                    </div>
                    <div class="territory-list">${tHtml}</div>
                    <button class="btn-add" onclick="openModal('${id}')">+</button>
                `;
                col.appendChild(card);
            }
            grid.appendChild(col);
        });
    }

    function openModal(id) {
        activeSlotId = id;
        document.getElementById('modal').style.display = 'flex';
        const numGrid = document.getElementById('num-grid');
        numGrid.innerHTML = '';
        for(let i=1; i<=36; i++) {
            const b = document.createElement('button');
            b.className = 'num-btn';
            b.innerText = i;
            b.onclick = () => {
                if(!territoryData[activeSlotId]) territoryData[activeSlotId] = [];
                territoryData[activeSlotId].push(i);
                saveAndRefresh();
                closeModal();
            };
            numGrid.appendChild(b);
        }
    }

    function removeT(id, index, e) {
        e.stopPropagation();
        territoryData[id].splice(index, 1);
        saveAndRefresh();
    }

    function saveAndRefresh() {
        localStorage.setItem('territoryData', JSON.stringify(territoryData));
        render();
    }

    function closeModal() { document.getElementById('modal').style.display = 'none'; }
    
    function clearData() {
        if(confirm('¿Reiniciar territories? Las fechas se mantendrán.')) {
            territoryData = {};
            saveAndRefresh();
        }
    }

    document.getElementById('btn-export').onclick = () => {
        const actions = document.querySelector('.actions');
        const addBtns = document.querySelectorAll('.btn-add');
        const picker = document.getElementById('picker-ui');
        
        // Esconder elementos de edición para la captura
        actions.style.display = 'none';
        picker.style.display = 'none';
        addBtns.forEach(b => b.style.display = 'none');

        html2canvas(document.querySelector("#capture-area"), {
            scale: 3, // Alta calidad
            backgroundColor: "#f0f2f5"
        }).then(canvas => {
            const link = document.createElement('a');
            link.download = `Programacion_Territorios_${selectedMonday}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
            
            // Mostrar elementos de edición de nuevo
            actions.style.display = 'flex';
            picker.style.display = 'block';
            addBtns.forEach(b => b.style.display = 'flex');
        });
    };

    init();
</script>

</body>
</html>
