<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Territory Assigner - Hola Germán</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            --card-bg: rgba(255, 255, 255, 0.8);
            --accent-blue: #2563eb;
            --text-main: #1e293b;
            --text-muted: #64748b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-main);
        }

        #app-container {
            width: 90%;
            max-width: 1000px;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            position: relative;
        }

        header h1 { font-size: 2.5rem; margin-bottom: 5px; }
        header p { color: var(--text-muted); margin-bottom: 40px; }

        .grid-semana {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .dia-card {
            background: white;
            padding: 20px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.2s;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .dia-nombre { font-weight: bold; font-size: 0.9rem; }
        .dia-fecha { font-size: 0.8rem; color: var(--text-muted); }

        .btn-add {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: none;
            background: var(--accent-blue);
            color: white;
            font-size: 24px;
            cursor: pointer;
            margin: 10px auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .territorio-asignado {
            font-size: 1.5rem;
            font-weight: 800;
            color: #059669;
            margin: 10px 0;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 25px;
            width: 300px;
            text-align: center;
        }

        .territorio-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            max-height: 200px;
            overflow-y: auto;
            margin: 20px 0;
            padding: 10px;
        }

        .territorio-item {
            padding: 10px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            cursor: pointer;
        }

        .territorio-item:hover { background: #f1f5f9; }
        .territorio-item.selected { background: var(--accent-blue); color: white; }

        .btn-confirmar {
            background: var(--accent-blue);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
        }

        .footer-actions {
            display: flex;
            justify-content: flex-end;
        }

        #btn-compartir {
            background: transparent;
            border: 1px solid #cbd5e1;
            padding: 10px 20px;
            border-radius: 15px;
            cursor: pointer;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #btn-compartir:hover { background: #f8fafc; }
    </style>
</head>
<body>

<div id="app-container">
    <header>
        <h1>Hola Germán</h1>
        <p id="rango-fecha">Para la semana del 2 de Marzo al 8 de Marzo de 2026</p>
    </header>

    <div class="grid-semana" id="grid-semana">
        </div>

    <div class="footer-actions">
        <button id="btn-compartir">📤 Compartir</button>
    </div>
</div>

<div id="modal-territorio" class="modal">
    <div class="modal-content">
        <h3 id="modal-titulo">Seleccionar Territorio</h3>
        <div class="territorio-grid" id="lista-territorios"></div>
        <button class="btn-confirmar" onclick="confirmarAsignacion()">Asignar</button>
    </div>
</div>

<script>
    const diasSemana = [
        { nombre: 'Lunes', fecha: '2 de Marzo', doble: false },
        { nombre: 'Martes', fecha: '3 de Marzo', doble: false },
        { nombre: 'Miércoles', fecha: '4 de Marzo', doble: true },
        { nombre: 'Jueves', fecha: '5 de Marzo', doble: false },
        { nombre: 'Viernes', fecha: '6 de Marzo', doble: true },
        { nombre: 'Domingo', fecha: '8 de Marzo', doble: false }
    ];

    let diaSeleccionadoIdx = null;
    let turnoSeleccionado = null;
    let asignaciones = {}; // Guarda { "idx-turno": numero }

    function init() {
        const grid = document.getElementById('grid-semana');
        diasSemana.forEach((dia, idx) => {
            const card = document.createElement('div');
            card.className = 'dia-card';
            
            let html = `
                <div class="dia-nombre">${dia.nombre}</div>
                <div class="dia-fecha">${dia.fecha}</div>
            `;

            if(dia.doble) {
                html += `
                    <div id="res-${idx}-1" class="territorio-asignado">--</div>
                    <button class="btn-add" onclick="abrirModal(${idx}, 1)">+</button>
                    <div id="res-${idx}-2" class="territorio-asignado">--</div>
                    <button class="btn-add" onclick="abrirModal(${idx}, 2)">+</button>
                `;
            } else {
                html += `
                    <div id="res-${idx}-0" class="territorio-asignado">--</div>
                    <button class="btn-add" onclick="abrirModal(${idx}, 0)">+</button>
                `;
            }
            
            card.innerHTML = html;
            grid.appendChild(card);
        });

        // Cargar lista de 36 territorios
        const lista = document.getElementById('lista-territorios');
        for(let i=1; i<=36; i++) {
            const item = document.createElement('div');
            item.className = 'territorio-item';
            item.innerText = i;
            item.onclick = () => seleccionarNumero(i, item);
            lista.appendChild(item);
        }
    }

    let numeroTemporal = null;

    function abrirModal(idx, turno) {
        diaSeleccionadoIdx = idx;
        turnoSeleccionado = turno;
        document.getElementById('modal-territorio').style.display = 'flex';
        // Reset selección visual
        document.querySelectorAll('.territorio-item').forEach(el => el.classList.remove('selected'));
    }

    function seleccionarNumero(num, elemento) {
        numeroTemporal = num;
        document.querySelectorAll('.territorio-item').forEach(el => el.classList.remove('selected'));
        elemento.classList.add('selected');
    }

    function confirmarAsignacion() {
        if(numeroTemporal) {
            const key = `${diaSeleccionadoIdx}-${turnoSeleccionado}`;
            asignaciones[key] = numeroTemporal;
            document.getElementById(`res-${key}`).innerText = numeroTemporal;
            
            // Ocultar botón "+" para que se vea limpio en la imagen (opcional)
            // document.querySelector(`button[onclick="abrirModal(${diaSeleccionadoIdx}, ${turnoSeleccionado})"]`).style.display = 'none';
            
            cerrarModal();
        }
    }

    function cerrarModal() {
        document.getElementById('modal-territorio').style.display = 'none';
        numeroTemporal = null;
    }

    // Lógica para exportar imagen
    document.getElementById('btn-compartir').addEventListener('click', () => {
        const contenedor = document.getElementById('app-container');
        const btn = document.getElementById('btn-compartir');
        
        // Escondemos el botón compartir para que no salga en la foto
        btn.style.visibility = 'hidden';

        html2canvas(contenedor, {
            backgroundColor: "#f5f7fa",
            scale: 2 // Mayor calidad
        }).then(canvas => {
            const link = document.createElement('a');
            link.download = `Programacion_Semanal.png`;
            link.href = canvas.toDataURL();
            link.click();
            btn.style.visibility = 'visible';
        });
    });

    init();
</script>

</body>
</html>
