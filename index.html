<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Territory Planner - Germán</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --bg-gradient: linear-gradient(145deg, #e2e8f0 0%, #cbd5e1 100%);
            --accent-blue: #3b82f6;
            --success-green: #10b981;
            --glass-bg: rgba(255, 255, 255, 0.7);
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-gradient);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        #capture-area {
            padding: 50px;
            background: var(--bg-gradient);
            border-radius: 40px;
        }

        .container {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 40px;
            width: 900px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
        }

        h1 { font-weight: 700; font-size: 2.2rem; margin: 0 0 10px 0; }
        .subtitle { color: #64748b; margin-bottom: 40px; font-size: 1.1rem; }

        .week-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr); /* 6 días activos */
            gap: 15px;
        }

        .day-column {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .card {
            background: white;
            aspect-ratio: 1 / 1; /* Esto fuerza a que sean cuadrados */
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            border: 1px solid rgba(255,255,255,0.8);
        }

        .day-label { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; color: #1e293b; }
        .date-label { font-size: 0.7rem; color: #94a3b8; margin-bottom: 8px; }

        .territory-num {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--success-green);
            line-height: 1;
        }

        .btn-add {
            width: 44px;
            height: 44px;
            background: var(--accent-blue);
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .btn-add:hover { transform: scale(1.1); }

        .share-row {
            margin-top: 30px;
            display: flex;
            justify-content: flex-end;
        }

        #btn-share {
            padding: 12px 24px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            background: white;
            cursor: pointer;
            font-weight: 600;
            color: #475569;
        }

        /* Modal simple */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 24px;
            width: 320px;
            text-align: center;
        }

        .num-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            max-height: 300px;
            overflow-y: auto;
            margin: 20px 0;
        }

        .num-item {
            padding: 10px;
            background: #f1f5f9;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .num-item.active { background: var(--accent-blue); color: white; }
    </style>
</head>
<body>

<div id="capture-area">
    <div class="container">
        <h1>Hola Germán</h1>
        <div class="subtitle">Para la semana del 2 de Marzo al 8 de Marzo de 2026</div>

        <div class="week-grid" id="main-grid">
            </div>

        <div class="share-row">
            <button id="btn-share">📤 Compartir programación</button>
        </div>
    </div>
</div>

<div id="modal" class="modal">
    <div class="modal-content">
        <h3>Asignar Territorio</h3>
        <div class="num-grid" id="num-grid"></div>
        <button onclick="saveAssignment()" style="width:100%; padding:12px; border-radius:10px; border:none; background:var(--accent-blue); color:white; font-weight:600; cursor:pointer;">Confirmar</button>
    </div>
</div>

<script>
    const days = [
        { name: 'Lunes', date: '2 Mar', shifts: 1 },
        { name: 'Martes', date: '3 Mar', shifts: 1 },
        { name: 'Miércoles', date: '4 Mar', shifts: 2 },
        { name: 'Jueves', date: '5 Mar', shifts: 1 },
        { name: 'Viernes', date: '6 Mar', shifts: 2 },
        { name: 'Domingo', date: '8 Mar', shifts: 1 }
    ];

    let currentTargetId = null;
    let selectedNum = null;

    function render() {
        const grid = document.getElementById('main-grid');
        grid.innerHTML = '';
        
        days.forEach((day, dIdx) => {
            const col = document.createElement('div');
            col.className = 'day-column';
            
            for(let s = 0; s < day.shifts; s++) {
                const id = `slot-${dIdx}-${s}`;
                const val = localStorage.getItem(id) || '--';
                
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="day-label">${day.name}</div>
                    <div class="date-label">${day.date}</div>
                    <div class="territory-num" id="text-${id}">${val}</div>
                    ${val === '--' ? `<button class="btn-add" onclick="openModal('${id}')">+</button>` : ''}
                `;
                // Si ya tiene valor, permitir resetear al hacer click en el número
                if(val !== '--') {
                    card.onclick = () => openModal(id);
                    card.style.cursor = 'pointer';
                }
                col.appendChild(card);
            }
            grid.appendChild(col);
        });
    }

    function openModal(id) {
        currentTargetId = id;
        document.getElementById('modal').style.display = 'flex';
        const numGrid = document.getElementById('num-grid');
        numGrid.innerHTML = '';
        for(let i=1; i<=36; i++) {
            const n = document.createElement('div');
            n.className = 'num-item';
            n.innerText = i;
            n.onclick = () => {
                selectedNum = i;
                document.querySelectorAll('.num-item').forEach(el => el.classList.remove('active'));
                n.classList.add('active');
            };
            numGrid.appendChild(n);
        }
    }

    function saveAssignment() {
        if(selectedNum) {
            localStorage.setItem(currentTargetId, selectedNum);
            document.getElementById('modal').style.display = 'none';
            selectedNum = null;
            render();
        }
    }

    document.getElementById('btn-share').onclick = () => {
        const btn = document.getElementById('btn-share');
        btn.style.display = 'none'; // Ocultar para la foto
        
        html2canvas(document.querySelector("#capture-area"), {
            scale: 2,
            backgroundColor: null
        }).then(canvas => {
            const link = document.createElement('a');
            link.download = 'territorios-semana.png';
            link.href = canvas.toDataURL();
            link.click();
            btn.style.display = 'block';
        });
    };

    render();
</script>

</body>
</html>
